<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Organize seu estoque e prepare listas de materiais para cada evento.">
  <title>Pronto pro Evento</title>
  <style>
    :root{--ink:#222820;--muted:#72786f;--paper:#f5f3ee;--card:#fffefa;--line:#e9e7df;--green:#285a45;--green2:#e4efe7;--orange:#e5a16e;--shadow:0 10px 34px #253c2810;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:0 24px 100px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.5px}.brandmark{width:36px;height:36px;background:var(--green);color:white;border-radius:12px;display:grid;place-items:center;font-size:19px}.brand span{font-size:16px}.topnote{color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:8px}.login-card{max-width:440px;margin:55px auto 0;padding:25px}.login-card h1{font-size:25px;letter-spacing:-.7px;margin:0 0 8px}.login-card p{font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 20px}.login-message{font-size:12px;color:#9a4f39;min-height:17px;margin-top:10px}.login-card .btn{width:100%;margin-top:6px}.logged-out .hero,.logged-out .tabs{display:none}.logged-out .app{max-width:640px}.logged-out #content{padding-bottom:40px}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800}.hero{padding:48px 0 30px;display:flex;justify-content:space-between;align-items:end;gap:20px}.hero h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.8px;margin:9px 0 8px;line-height:1.05}.hero p{margin:0;color:var(--muted);font-size:15px}.hero-mark{font-size:44px;filter:saturate(.85);padding:0 8px 3px}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:24px}.tab{background:transparent;border:0;padding:12px 17px;color:var(--muted);font-weight:650;font-size:14px;position:relative}.tab.active{color:var(--green)}.tab.active:after{content:"";height:2px;position:absolute;bottom:-1px;left:12px;right:12px;background:var(--green);border-radius:2px}.tab .count{font-size:11px;background:#e9e8e0;border-radius:12px;padding:2px 7px;margin-left:5px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;gap:10px}.section-head h2{font-size:18px;letter-spacing:-.4px;margin:0}.section-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:11px;font-size:13px;font-weight:650;box-shadow:0 2px 5px #00000005}.btn:hover{border-color:#c8d2c8}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.primary:hover{background:#204d3a}.btn.soft{background:var(--green2);border-color:transparent;color:var(--green)}.btn.icon{font-size:17px;padding:7px 10px;box-shadow:none}.event-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}.panel,.event-card,.metric{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.panel{padding:17px}.panel h3{margin:1px 0 14px;font-size:14px}.event-list{display:grid;gap:8px}.event-row{border:1px solid transparent;background:transparent;text-align:left;padding:12px;border-radius:12px;display:flex;align-items:flex-start;gap:10px;color:var(--ink)}.event-row:hover{background:#f8f7f2}.event-row.selected{background:#eef4ee;border-color:#dce9de}.event-dot{width:9px;height:9px;background:var(--orange);border-radius:50%;margin-top:5px;flex:0 0 auto}.event-row:nth-child(2n) .event-dot{background:#8bac91}.event-row strong{display:block;font-size:13px;font-weight:700}.event-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.main-panel{padding:22px}.event-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.event-title h2{margin:0;font-size:21px;letter-spacing:-.65px}.event-title p{color:var(--muted);font-size:13px;margin:5px 0 0}.event-actions{display:flex;gap:7px}.summary-strip{display:flex;gap:8px;margin:19px 0;background:#f6f5ef;border-radius:12px;padding:11px 13px}.summary-cell{flex:1}.summary-cell strong{display:block;font-size:17px}.summary-cell small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:480px}.table th{text-align:left;padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#80857c;background:#f9f8f4;font-weight:750}.table td{border-top:1px solid var(--line);padding:12px;font-size:13px}.qty{font-weight:750;color:var(--green)}.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}.below{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:12px;gap:10px}.inventory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:17px}.metric .emoji{font-size:19px}.metric strong{display:block;margin-top:8px;font-size:15px}.metric small{color:var(--muted);font-size:12px}.stock-count{float:right;color:var(--green);font-weight:750;font-size:13px}.inventory-table td:last-child{text-align:right}.delete{color:#9a6252;border:0;background:none;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#17231e70;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(440px,100%);background:var(--card);border-radius:18px;padding:23px;box-shadow:0 25px 80px #12221835}.modal h2{margin:0 0 18px;font-size:21px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dedfd7;border-radius:10px;padding:11px 12px;background:#fffefa;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#70947b;box-shadow:0 0 0 3px #285a4515}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263a2e;color:white;padding:11px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:20}.mobile-add{display:none}.print-only{display:none}
    @media(max-width:740px){.app{padding:0 15px 90px}.topbar{height:65px}.topnote{font-size:11px}.hero{padding:33px 0 23px}.hero-mark{font-size:36px}.event-layout{grid-template-columns:1fr}.panel{padding:13px}.panel h3{margin:1px 0 10px}.event-list{display:flex;overflow:auto;padding-bottom:2px}.event-row{min-width:145px;padding:10px;background:#f9f8f4}.event-row strong{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}.main-panel{padding:16px}.event-title h2{font-size:18px}.event-actions .btn{font-size:11px;padding:9px}.inventory-grid{grid-template-columns:repeat(2,1fr)}.section-head h2{font-size:16px}.below{align-items:flex-start;flex-direction:column}.mobile-add{display:block;position:fixed;right:19px;bottom:20px;border:0;border-radius:50px;padding:15px 19px;color:white;background:var(--green);font-weight:750;box-shadow:0 7px 25px #1d45343b;z-index:5}.tabs{margin-bottom:18px}}
    @media(max-width:740px){.topnote{display:none}.top-actions{gap:6px}.top-actions .btn{padding:9px 10px}}
    @media(max-width:390px){.topnote{display:none}.hero-mark{display:none}.field-row{grid-template-columns:1fr}.summary-cell small{font-size:9px}}
    @media print{body{background:white}.topbar,.hero,.tabs,.panel,.section-head,.event-actions,.below,.mobile-add,.summary-strip,.no-print{display:none!important}.app{padding:0;max-width:none}.event-layout{display:block}.main-panel{border:0;box-shadow:none;padding:0}.print-only{display:block}.print-header{border-bottom:2px solid #285a45;padding:0 0 14px;margin-bottom:18px}.print-header h1{font-size:24px;margin:0 0 6px}.print-meta{font-size:12px;color:#555}.event-title h2{font-size:20px}.event-title p{font-size:12px}.table-wrap{border-radius:0}.table th{background:#f0f0ed!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.table td,.table th{padding:11px 9px}.qty{color:#222}.print-foot{display:block;margin-top:24px;border-top:1px solid #bbb;padding-top:9px;font-size:10px;color:#666}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="brandmark">✓</div><span>Pronto pro Evento</span></div><div class="top-actions"><span class="topnote" id="topnote">Estoque e eventos compartilhados</span><button class="btn" id="home">⌂ Início</button><button class="btn" id="sync-now">Atualizar</button></div></header>
    <section class="hero"><div><div class="eyebrow">Organização sem correria</div><h1>Deixe tudo pronto<br>para o grande dia.</h1><p>Monte a lista de cada evento direto do seu estoque.</p></div><div class="hero-mark">📋</div></section>
    <nav class="tabs"><button class="tab active" data-tab="events">Eventos <span class="count" id="event-count">0</span></button><button class="tab" data-tab="stock">Meu estoque <span class="count" id="stock-count">0</span></button></nav>
    <main id="content"></main>
  </div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
  <script>
  (()=>{
    const KEY='pronto-evento-v1';
    const CLOUD={url:'https://sghlljygibqbhdbjaedw.supabase.co',key:'sb_publishable_dyqQgH51mrGS8MNoQk48_g_CSM0LdsC'};
    const supabase=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    let state={stock:[],events:[]},selected=null,tab='events',saveTimer=null;
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const {error}=await supabase.from('event_checklist_state').update({payload:state,updated_at:new Date().toISOString()}).eq('id',1);if(error)toast('Não foi possível salvar na nuvem: '+error.message);else toast('Alterações salvas no banco compartilhado.')},350)};const fmtDate=d=>d?new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z')):'Data a confirmar';
    function validState(value){return value&&Array.isArray(value.stock)&&Array.isArray(value.events)?value:{stock:[],events:[]}}
    function isBlank(value){return !value.stock.length&&!value.events.length}
    async function fetchSharedState(){const {data,error}=await supabase.from('event_checklist_state').select('payload').eq('id',1).single();if(error)throw error;return validState(data.payload)}
    function activateApp(){document.body.classList.remove('logged-out');$('#topnote').textContent='Estoque e eventos compartilhados';$('#sync-now').hidden=false;render()}
    async function syncNow(){try{state=await fetchSharedState();if(!state.events.some(e=>e.id===selected))selected=state.events[0]?.id||null;render();toast('Dados compartilhados atualizados.')}catch(err){toast('Erro ao atualizar: '+err.message)}}
    async function boot(){try{const remote=await fetchSharedState();let local=null;try{local=JSON.parse(localStorage.getItem(KEY))}catch{}if(isBlank(remote)&&local&&!isBlank(validState(local))&&confirm('Encontramos dados antigos salvos somente neste aparelho. Deseja copiá-los para o banco compartilhado?')){state=validState(local);save()}else state=remote;selected=state.events[0]?.id||null;activateApp()}catch(err){document.body.classList.remove('logged-out');$('#content').innerHTML=`<div class="panel empty"><strong>Não foi possível carregar os dados</strong>${esc(err.message)}<p><button class="btn primary" id="retry-load">Tentar novamente</button></p></div>`;$('#retry-load').onclick=boot}}
    function render(){ $('#event-count').textContent=state.events.length;$('#stock-count').textContent=state.stock.length;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));tab==='events'?renderEvents():renderStock() }
    function renderEvents(){const ev=state.events.find(e=>e.id===selected);$('#content').innerHTML=`<div class="section-head"><div><h2>Seus eventos</h2><p>Um checklist personalizado para cada ocasião.</p></div><button class="btn primary" id="new-event">＋ Novo evento</button></div><div class="event-layout"><aside class="panel"><h3>Lista de eventos</h3><div class="event-list">${state.events.length?state.events.map(e=>`<button class="event-row ${e.id===selected?'selected':''}" data-event="${e.id}"><span class="event-dot"></span><span><strong>${esc(e.name)}</strong><small>${esc(fmtDate(e.date))}</small></span></button>`).join(''):'<div class="empty">Nenhum evento ainda.<br>Crie o primeiro para começar.</div>'}</div></aside>${ev?`<section class="panel main-panel"><div class="print-only print-header"><h1>Checklist do evento</h1><div class="print-meta">Pronto pro Evento · Lista de materiais</div></div><div class="event-title"><div><h2>${esc(ev.name)}</h2><p>${esc(fmtDate(ev.date))}${ev.place?' · '+esc(ev.place):''}</p></div><div class="event-actions"><button class="btn" id="edit-event">Editar</button><button class="btn primary" id="pdf">↓ PDF</button></div></div>${ev.notes?`<p style="font-size:12px;color:var(--muted);margin:14px 0 0">${esc(ev.notes)}</p>`:''}<div class="summary-strip"><div class="summary-cell"><strong>${ev.items.length}</strong><small>itens na lista</small></div><div class="summary-cell"><strong>${ev.items.reduce((a,i)=>a+Number(i.qty||0),0)}</strong><small>peças separadas</small></div><div class="summary-cell"><strong>${state.stock.length}</strong><small>itens no estoque</small></div></div><div class="section-head" style="margin-bottom:10px"><div><h2 style="font-size:14px">Materiais para levar</h2></div><button class="btn soft no-print" id="add-item">＋ Adicionar item</button></div><div class="table-wrap">${eventTable(ev)}</div><div class="below"><span>Confira as quantidades antes de carregar.</span><button class="btn no-print" id="clear-event">Limpar checklist</button></div><div class="print-only print-foot">Conferido por: ____________________________　　Data: ____ / ____ / ______</div></section>`:`<section class="panel main-panel"><div class="empty"><strong>${state.events.length?'Selecione um evento':'Seu primeiro evento começa aqui'}</strong>${state.events.length?'Escolha um evento na lista para ver o checklist.':'Cadastre o evento e adicione os materiais que vai levar.'}<p><button class="btn primary" id="new-event-empty">＋ Criar evento</button></p></div></section>`}</div><button class="mobile-add" id="mobile-add">＋ Novo evento</button>`;
      document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{selected=b.dataset.event;render()});$('#new-event')?.addEventListener('click',()=>eventModal());$('#new-event-empty')?.addEventListener('click',()=>eventModal());$('#mobile-add')?.addEventListener('click',()=>eventModal());$('#edit-event')?.addEventListener('click',()=>eventModal(ev));$('#add-item')?.addEventListener('click',()=>itemModal(ev));$('#pdf')?.addEventListener('click',()=>window.print());$('#clear-event')?.addEventListener('click',()=>{if(confirm('Remover todos os itens deste checklist?')){ev.items=[];save();render()}})
    }
    function eventTable(ev){if(!ev.items.length)return '<div class="empty"><strong>Checklist vazio por enquanto</strong>Adicione materiais do seu estoque para montar a lista deste evento.</div>';return `<table class="table"><thead><tr><th>Item</th><th>Quantidade</th><th>Estoque disponível</th><th class="no-print"></th></tr></thead><tbody>${ev.items.map((it,i)=>{const s=state.stock.find(x=>x.id===it.stockId);return `<tr><td><strong>${esc(s?.name||'Item removido')}</strong></td><td class="qty">${it.qty} ${esc(s?.unit||'unidades')}</td><td>${s?`${s.qty} ${esc(s.unit)}`:'—'}</td><td class="no-print"><button class="delete" data-remove="${i}">Remover</button></td></tr>`}).join('')}</tbody></table>`}
    function renderStock(){$('#content').innerHTML=`<div class="section-head"><div><h2>Meu estoque</h2><p>Cadastre tudo que você tem disponível para os eventos.</p></div><button class="btn primary" id="new-stock">＋ Adicionar item</button></div><div class="inventory-grid">${state.stock.map(s=>`<article class="metric"><span class="emoji">📦</span><span class="stock-count">${s.qty} ${esc(s.unit)}</span><strong>${esc(s.name)}</strong><small>Disponível no estoque</small></article>`).join('')}</div>${state.stock.length?`<div style="height:18px"></div><div class="panel"><h3>Itens cadastrados</h3><div class="table-wrap"><table class="table inventory-table"><thead><tr><th>Item</th><th>Quantidade disponível</th><th>Ações</th></tr></thead><tbody>${state.stock.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${s.qty} ${esc(s.unit)}</td><td><button class="btn soft" data-stock-edit="${s.id}">Alterar quantidade</button> <button class="delete" data-stock-delete="${s.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`:`<div class="panel empty"><strong>Seu estoque está vazio</strong>Adicione itens para usá-los nos checklists dos seus eventos.</div>`}`;$('#new-stock').onclick=()=>stockModal();document.querySelectorAll('[data-stock-edit]').forEach(b=>b.onclick=()=>{const s=state.stock.find(x=>x.id===b.dataset.stockEdit);if(s)stockQtyModal(s)});document.querySelectorAll('[data-stock-delete]').forEach(b=>b.onclick=()=>{const s=state.stock.find(x=>x.id===b.dataset.stockDelete);if(confirm(`Excluir ${s?.name} do estoque?`)){state.stock=state.stock.filter(x=>x.id!==b.dataset.stockDelete);save();render()}})}
    function showModal(title,body,onSave){$('#modal-root').innerHTML=`<div class="modal-backdrop"><form class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form></div>`;const back=$('.modal-backdrop');$('#cancel').onclick=()=>$('#modal-root').innerHTML='';back.addEventListener('click',e=>{if(e.target===back)$('#modal-root').innerHTML=''});$('.modal').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));if(onSave(data)!==false){$('#modal-root').innerHTML='';render()}};$('.modal input')?.focus()}
    function eventModal(ev){showModal(ev?'Editar evento':'Novo evento',`<div class="field"><label>Nome do evento</label><input name="name" required placeholder="Ex.: Festa de aniversário" value="${esc(ev?.name||'')}"></div><div class="field-row"><div class="field"><label>Data</label><input type="date" name="date" value="${esc(ev?.date||'')}"></div><div class="field"><label>Local</label><input name="place" placeholder="Espaço ou endereço" value="${esc(ev?.place||'')}"></div></div><div class="field"><label>Observações</label><input name="notes" placeholder="Horário, contato, detalhes…" value="${esc(ev?.notes||'')}"></div>`,d=>{if(ev)Object.assign(ev,d);else{const e={id:crypto.randomUUID(),...d,items:[]};state.events.unshift(e);selected=e.id}save()})}
    function stockModal(){showModal('Adicionar ao estoque',`<div class="field"><label>Nome do item</label><input name="name" required placeholder="Ex.: Toalhas brancas"></div><div class="field-row"><div class="field"><label>Quantidade</label><input name="qty" type="number" min="0" required placeholder="0"></div><div class="field"><label>Unidade</label><select name="unit"><option>unidades</option><option>caixas</option><option>pacotes</option><option>metros</option><option>kits</option><option>litros</option><option>kg</option></select></div></div>`,d=>{state.stock.push({id:crypto.randomUUID(),name:d.name.trim(),qty:Number(d.qty),unit:d.unit});save()})}
    function stockQtyModal(item){showModal('Alterar quantidade',`<div class="field"><label>Item</label><input value="${esc(item.name)}" disabled></div><div class="field"><label>Quantidade disponível (${esc(item.unit)})</label><input name="qty" type="number" min="0" required value="${Number(item.qty)||0}"></div>`,d=>{item.qty=Number(d.qty);save()})}
    function itemModal(ev){if(!state.stock.length){toast('Cadastre itens no estoque primeiro.');return}showModal('Adicionar material',`<div class="field"><label>Item do estoque</label><select name="stockId">${state.stock.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.qty} ${esc(s.unit)}</option>`).join('')}</select></div><div class="field"><label>Quantidade para este evento</label><input name="qty" type="number" min="1" required placeholder="Quantas unidades?" value="1"></div>`,d=>{const existing=ev.items.find(i=>i.stockId===d.stockId);if(existing)existing.qty=Number(existing.qty)+Number(d.qty);else ev.items.push({stockId:d.stockId,qty:Number(d.qty)});save()})}
    function toast(msg){$('#toast-root').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',2800)}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){const ev=state.events.find(x=>x.id===selected);ev.items.splice(Number(b.dataset.remove),1);save();render()}});$('#home').onclick=()=>{tab='events';render()};$('#sync-now').onclick=syncNow;boot();
  })();
  </script>
</body>
</html>
